name: Pipeline

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: UTC day to ingest, YYYY-MM-DD (default yesterday)
        required: false
        type: string
      season:
        description: Season to rank and enrich, YYYY-MM (default the season of the date)
        required: false
        type: string

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  daily:
    name: Ingest, rank, enrich, rank
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATA_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Run pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          INPUT_DATE: ${{ inputs.date }}
          INPUT_SEASON: ${{ inputs.season }}
        run: |
          args=(--storage github)
          if [ -n "$INPUT_DATE" ]; then args+=(--date "$INPUT_DATE"); fi
          if [ -n "$INPUT_SEASON" ]; then args+=(--season "$INPUT_SEASON"); fi
          bun run scripts/pipeline.ts "${args[@]}"
