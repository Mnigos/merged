name: Backfill

on:
  workflow_dispatch:
    inputs:
      from:
        description: First UTC day to ingest, YYYY-MM-DD; keep a range under about 20 days per run (a day takes 5–10 min)
        required: true
        type: string
      to:
        description: Last UTC day to ingest, YYYY-MM-DD
        required: true
        type: string
      season:
        description: Season to rank and enrich, YYYY-MM (default the season of `to`)
        required: false
        type: string

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ingest:
    name: Ingest range, rank, enrich, rank
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      DATA_REPOSITORY: ${{ github.repository }}
      GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Run pipeline over the range
        env:
          INPUT_FROM: ${{ inputs.from }}
          INPUT_TO: ${{ inputs.to }}
          INPUT_SEASON: ${{ inputs.season }}
        run: |
          args=(--storage github --from "$INPUT_FROM" --date "$INPUT_TO")
          if [ -n "$INPUT_SEASON" ]; then args+=(--season "$INPUT_SEASON"); fi
          bun run scripts/pipeline.ts "${args[@]}"
